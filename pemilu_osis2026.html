<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pemilu OSIS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:10px;

    background:#eef2f7;

    font-family:Arial,sans-serif;
    text-align:center;

    height:100vh;
    overflow:hidden;
}

/* ========================= */
/* JUDUL */
/* ========================= */

.judul-utama{
    margin-bottom:12px;
}

.judul-utama h1{
    margin:0;

    font-size:clamp(28px, 3vw, 58px);

    font-weight:900;
}

.judul-utama h2{
    margin-top:8px;

    font-size:clamp(16px, 1.5vw, 28px);

    color:#1e3a8a;
}

/* ========================= */
/* CONTAINER */
/* ========================= */

.container{
    display:flex;

    justify-content:center;
    align-items:stretch;

    gap:15px;

    height:calc(100vh - 190px);
}

/* ========================= */
/* CARD */
/* ========================= */

.card{
    background:white;

    flex:1;

    border-radius:25px;

    padding:14px;

    box-shadow:0 5px 20px rgba(0,0,0,0.12);

    cursor:pointer;

    transition:0.15s;

    user-select:none;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

.card:active{
    transform:scale(0.98);
}

.nama{
    font-size:clamp(28px, 2vw, 42px);

    font-weight:bold;

    margin-bottom:10px;
}

/* ========================= */
/* TURUS */
/* ========================= */

.turus{
    height:130px;

    overflow-y:auto;

    display:flex;

    justify-content:center;
    align-items:flex-start;
    align-content:flex-start;

    flex-wrap:wrap;

    gap:10px;

    padding:10px;

    border-radius:15px;

    background:#f1f5f9;

    margin-bottom:10px;

    scroll-behavior:smooth;
}

.grup{
    position:relative;

    width:55px;
    height:55px;
}

.garis{
    position:absolute;

    width:4px;
    height:45px;

    background:black;

    border-radius:5px;

    top:0;
}

.miring{
    position:absolute;

    width:4px;
    height:60px;

    background:black;

    transform:rotate(-65deg);

    left:24px;
    top:-7px;

    border-radius:5px;
}

/* ========================= */
/* JUMLAH */
/* ========================= */

.jumlah{
    font-size:clamp(40px, 4vw, 70px);

    font-weight:bold;

    margin-bottom:14px;
}

/* ========================= */
/* POSTER */
/* ========================= */

.poster{
    width:100%;

    flex:1;

    object-fit:contain;

    border-radius:18px;

    min-height:0;
}

/* ========================= */
/* BUTTON */
/* ========================= */

.buttons{
    margin-top:12px;
}

button{
    font-size:clamp(16px, 1.2vw, 24px);

    padding:12px 24px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    margin:5px;

    color:white;

    font-weight:bold;

    transition:0.2s;
}

button:hover{
    opacity:0.9;
}

.undo{
    background:orange;
}

.reset{
    background:crimson;
}

.download{
    background:green;
}

/* ========================= */
/* RESPONSIVE HP */
/* ========================= */

@media(max-width:900px){

    body{
        height:auto;
        overflow:auto;
    }

    .container{
        flex-direction:column;

        height:auto;
    }

    .card{
        min-height:700px;
    }

    .poster{
        height:400px;
    }

}

</style>
</head>

<body>

<div class="judul-utama">

    <h1>PEMILU KETUA DAN WAKIL KETUA OSIS</h1>

    <h2>SMP KRISTEN MASA DEPAN CERAH SURABAYA 2026</h2>

</div>

<div class="container">

    <!-- PASLON 1 -->

    <div class="card" onclick="tambah(0)">

        <div class="nama">PASLON 1</div>

        <div class="turus" id="turus0"></div>

        <div class="jumlah" id="jumlah0">0</div>

        <img class="poster" src="Paslon 1 (Kaylee & Nico).jpeg">

    </div>

    <!-- PASLON 2 -->

    <div class="card" onclick="tambah(1)">

        <div class="nama">PASLON 2</div>

        <div class="turus" id="turus1"></div>

        <div class="jumlah" id="jumlah1">0</div>

        <img class="poster" src="Paslon 2 (Evan & Neiska).jpeg">

    </div>

    <!-- PASLON 3 -->

    <div class="card" onclick="tambah(2)">

        <div class="nama">PASLON 3</div>

        <div class="turus" id="turus2"></div>

        <div class="jumlah" id="jumlah2">0</div>

        <img class="poster" src="Paslon 3 (Christalia & Anna).jpeg">

    </div>

</div>

<div class="buttons">

    <button class="undo" onclick="undo(event)">
        UNDO
    </button>

    <button class="reset" onclick="resetData(event)">
        RESET
    </button>

    <button class="download" onclick="downloadExcel(event)">
        DOWNLOAD EXCEL
    </button>

</div>

<script>

/* ========================= */
/* DATA */
/* ========================= */

let suara = [0,0,0];

let riwayat = [];

/* ========================= */
/* BUAT TURUS */
/* ========================= */

function buatTurus(n){

    let hasil = "";

    let grup5 = Math.floor(n / 5);

    let sisa = n % 5;

    for(let g=0; g<grup5; g++){

        hasil += `
        <div class="grup">

            <div class="garis" style="left:5px;"></div>

            <div class="garis" style="left:17px;"></div>

            <div class="garis" style="left:29px;"></div>

            <div class="garis" style="left:41px;"></div>

            <div class="miring"></div>

        </div>
        `;
    }

    if(sisa > 0){

        hasil += `<div class="grup">`;

        for(let i=0; i<sisa; i++){

            hasil += `
            <div class="garis" style="left:${5 + (i*12)}px;"></div>
            `;
        }

        hasil += `</div>`;
    }

    return hasil;
}

/* ========================= */
/* UPDATE */
/* ========================= */

function update(){

    for(let i=0; i<3; i++){

        document.getElementById("jumlah"+i).innerText = suara[i];

        document.getElementById("turus"+i).innerHTML = buatTurus(suara[i]);

        /* AUTO SCROLL */

        let box = document.getElementById("turus"+i);

        box.scrollTop = box.scrollHeight;
    }
}

/* ========================= */
/* TAMBAH SUARA */
/* ========================= */

function tambah(index){

    suara[index]++;

    riwayat.push(index);

    update();
}

/* ========================= */
/* UNDO */
/* ========================= */

function undo(event){

    event.stopPropagation();

    if(riwayat.length > 0){

        let terakhir = riwayat.pop();

        suara[terakhir]--;

        update();
    }
}

/* ========================= */
/* RESET */
/* ========================= */

function resetData(event){

    event.stopPropagation();

    let yakin = confirm("Yakin reset semua suara?");

    if(yakin){

        suara = [0,0,0];

        riwayat = [];

        update();
    }
}

/* ========================= */
/* DOWNLOAD CSV */
/* ========================= */

function downloadExcel(event){

    event.stopPropagation();

    let csv =
`Paslon,Suara
Paslon 1,${suara[0]}
Paslon 2,${suara[1]}
Paslon 3,${suara[2]}`;

    let blob = new Blob([csv], { type:'text/csv' });

    let link = document.createElement('a');

    link.href = URL.createObjectURL(blob);

    link.download = 'hasil_pemilu_osis.csv';

    link.click();
}

/* ========================= */
/* LOAD */
/* ========================= */

update();

</script>

</body>
</html>
